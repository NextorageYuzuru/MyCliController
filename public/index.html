<!doctype html>
<html lang="zh-Hant" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Claude CLI Controller</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-ctl">
      <button id="btnNew" class="btn newbtn" type="button" title="新對話 (Ctrl+N)" data-ico="plus" data-ico-label="新對話"></button>
      <button id="btnWebToggle" class="btn icon" type="button" title="顯示／隱藏瀏覽器分頁群組" data-ico="globe"></button>
      <button id="btnSbHide" class="btn icon" type="button" title="收起左側列表 (Ctrl+B)" data-ico="chevsL"></button>
    </div>
    <div class="sb-tools">
      <input id="search" type="search" placeholder="搜尋對話 / 資料夾…" spellcheck="false">
    </div>
    <div class="seg" id="modeSeg">
      <button id="btnSource" type="button"></button>
      <button id="btnSort" type="button"></button>
    </div>
    <div id="sessionList"></div>
    <div class="sb-foot">
      <!-- only shown when the account in use has a problem (filled by renderAcctAlert) -->
      <div id="authAlert" class="authalert" hidden></div>
      <div id="usage">
        <div class="uhead">
          <span class="utitle" title="目前使用中帳號的方案用量，和在 claude 裡打 /usage 看到的一樣">用量</span>
          <select id="uAcct" class="uacct" title="切換帳號：之後送出的訊息改用這個帳號（正在執行的對話這一輪結束後才換）" hidden></select>
          <span id="uUpdated" class="muted"></span>
          <span class="grow"></span>
          <button id="uRefresh" class="btn icon small" title="立即更新用量（送出一個極小的 Haiku 請求，約 650 tokens）。對話執行中會自動更新，不需要按" data-ico="refresh" data-ico-size="13"></button>
        </div>
        <div id="uRows"></div>
      </div>
      <div class="footrow">
        <div id="verLine" class="muted small"></div>
        <button id="btnKillServer" class="btn icon small" title="關閉後端（結束背景服務和它開的 claude 對話；有對話在執行會先確認）" data-ico="power" data-ico-size="14"></button>
        <button id="btnRestartServer" class="btn icon small" title="重啟後端（不用重開視窗，換成新版；有對話在執行會先確認）" data-ico="restart" data-ico-size="14"></button>
        <span class="grow"></span>
        <button id="btnSettings" class="btn icon" title="設定（帳號、外觀、左側列表、對話…）" data-ico="settings"></button>
      </div>
    </div>
  </aside>
  <div id="sbRail" hidden>
    <button id="btnSbShow" class="btn icon" title="展開左側列表 (Ctrl+B)"><span data-ico="chevsR"></span><i id="railDot"></i></button>
    <button id="btnTabs" class="btn icon" title="顯示／隱藏頂端分頁列" data-ico="tabs"></button>
    <button id="btnNewRail" class="btn icon" title="新對話 (Ctrl+N)" data-ico="plus"></button>
    <div class="grow"></div>
    <div id="railGauges"></div>
  </div>

  <main id="main">
    <div id="tabBar" hidden><div id="tabShort"></div><div id="tabScroll"></div></div>
    <!-- content area: one pane, or two side by side (右側分割視窗). Each pane has its own header and transcript. -->
    <div id="panes"></div>
    <template id="paneTpl">
      <section class="pane">
        <header class="chatHead">
          <div class="hleft">
            <div class="htitle" data-role="title" title="雙擊重新命名">新對話</div>
            <div class="hsub"><span class="chip hcwd" data-role="cwd" title="在檔案總管開啟"></span><span class="hmodel" data-role="model"></span></div>
          </div>
          <div class="hright">
            <button class="btn icon" data-act="split-swap" title="與主視窗互換（這一格變主視窗，主視窗變副視窗）" data-ico="swap"></button>
            <button class="btn icon" data-act="split-close" title="關閉右側分割視窗" data-ico="x"></button>
          </div>
        </header>
        <div class="transcript"></div>
      </section>
    </template>
    <div id="composer">
      <div id="cmdPop" hidden>
        <div class="pphead"><span class="pptitle"><span data-ico="slash" data-ico-size="14"></span>指令</span><span class="muted small" id="cmdHint"></span></div>
        <div id="cmdList"></div>
        <div class="ppfoot"><span class="muted small">↑↓ 選擇 · Enter / Tab 選用（不需參數的指令會直接執行）· Esc 關閉</span></div>
      </div>
      <div id="promptPop" hidden>
        <div class="pphead">
          <span class="pptitle"><span data-ico="zap" data-ico-size="14"></span>常用 Prompt</span>
          <input id="ppSearch" type="search" placeholder="搜尋…">
        </div>
        <div id="ppList"></div>
        <div class="ppfoot">
          <span class="muted small">↑↓ 選擇 · Enter 插入 · Ctrl+Enter 插入並送出 · Esc 關閉</span>
          <span class="grow"></span>
          <button id="ppSaveCur" class="btn small" title="把輸入框目前的內容存成常用 Prompt">把目前輸入存成常用</button>
          <button id="ppNew" class="btn small primary" data-ico="plus" data-ico-label="新增" data-ico-size="13"></button>
        </div>
      </div>
      <div id="queueBox" hidden></div>
      <div id="attachments"></div>
      <div class="inputwrap">
        <textarea id="input" rows="1" placeholder="輸入訊息… (Enter 送出，Shift+Enter 換行，可貼上/拖放圖片)"></textarea>
      <div class="crow">
        <label class="sel" title="模型"><span>模型</span>
          <select id="selModel">
            <option value="">預設</option>
            <option value="fable">Fable</option>
            <option value="opus">Opus</option>
            <option value="sonnet">Sonnet</option>
            <option value="haiku">Haiku</option>
            <option value="__custom">自訂…</option>
          </select>
        </label>
        <label class="sel" title="思考程度 (--effort)"><span>程度</span>
          <select id="selEffort">
            <option value="">預設</option>
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max">max</option>
          </select>
        </label>
        <label class="sel" title="權限模式 (--permission-mode)"><span>權限</span>
          <select id="selPerm">
            <option value="auto">Auto</option>
            <option value="bypassPermissions">略過所有權限</option>
          </select>
        </label>
        <span class="grow"></span>
        <span id="ctxMeter" class="ctx" hidden><span class="ctxlabel">Context</span><span class="ctxbar"><i></i></span><span class="ctxnum"></span></span>
        <button id="btnPoke" class="btn icon pokebtn" hidden></button>
        <button id="btnCmds" class="btn icon slashbtn" title="指令選單（在輸入框開頭打 / 也可以）" data-ico="slash"></button>
        <button id="btnPrompts" class="btn icon" title="常用 Prompt (Ctrl+/，或在輸入框開頭打 //)" data-ico="zap"></button>
        <button id="btnAttach" class="btn icon" title="附加圖片" data-ico="clip"></button>
        <input id="fileInput" type="file" accept="image/*" multiple hidden>
        <button id="btwBtn" class="btn icon" title="順帶一提（快速問一個不寫進對話的問題；或打 /btw）" data-ico="msg"></button>
        <button id="btnStop" class="btn danger stopbtn" hidden data-ico="stop" data-ico-label="停止" data-ico-size="12"></button>
        <button id="btnSend" class="btn primary sendbtn"><span class="blabel">送出</span></button>
      </div>
      </div>
    </div>
  </main>

  <div id="splitter" hidden></div>
  <aside id="viewer" hidden>
    <div class="vhead">
      <span id="vTitle" class="vtitle"></span>
      <button id="vFit" class="btn small" title="切換 適合視窗 / 原始尺寸">適合</button>
      <button id="vReveal" class="btn icon small" title="在檔案總管顯示" data-ico="folder" data-ico-size="14"></button>
      <button id="vZoom" class="btn icon small" title="放大（燈箱）" data-ico="expand" data-ico-size="14"></button>
      <button id="vClose" class="btn icon small" title="關閉" data-ico="x" data-ico-size="14"></button>
    </div>
    <div id="vBody"><div id="vEmpty" class="muted">點對話中的圖片，或圖片路徑連結，就會在這裡顯示。</div><img id="vImg" alt="" hidden></div>
    <div id="vStrip"></div>
  </aside>
</div>
<div id="promptModal" class="modalbg" hidden>
  <form id="pmForm" class="modal">
    <h3 id="pmHead">新增常用 Prompt</h3>
    <label class="field"><span>名稱 <span class="muted small">（選填，空白會用內容第一行）</span></span><input id="pmTitle" type="text" maxlength="200"></label>
    <label class="field"><span>內容</span><textarea id="pmText" rows="10" required></textarea></label>
    <div class="mbtns">
      <button type="button" id="pmDelete" class="btn danger">刪除</button>
      <span class="grow"></span>
      <button type="button" id="pmCancel" class="btn">取消</button>
      <button type="submit" class="btn primary">儲存 (Ctrl+Enter)</button>
    </div>
  </form>
</div>
<div id="settingsModal" class="modalbg" hidden>
  <div class="modal settings">
    <div class="mhead"><h3><span data-ico="settings" data-ico-size="17"></span>設定</h3><span class="grow"></span><button id="setClose" class="btn icon" title="關閉 (Esc)" data-ico="x"></button></div>
    <div id="setBody"></div>
    <div class="muted small">設定會立即套用，不用儲存。</div>
  </div>
</div>
<div id="serverDown" class="modalbg srvdown" hidden>
  <div class="modal">
    <h3 id="sdTitle"></h3>
    <div id="sdBody"></div>
    <div class="mbtns">
      <span class="grow"></span>
      <button id="sdRetry" class="btn primary">重新連線</button>
    </div>
  </div>
</div>
<div id="menu" hidden></div>
<div id="toast" hidden></div>
<script src="md.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
